#Managed by Terraform; edits made here are overwritten on its next apply.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH: ${{ github.ref == 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  build:
    #arm64 only, one tag per commit: Lambda runs one architecture and refuses a multi-architecture index
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --platform linux/arm64 --provenance=false --sbom=false -t of-failover:ci .
      - run: |
          docker run -d -p 9000:8080 --name of-failover of-failover:ci
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 -d '{"action":"ping"}' localhost:9000/2015-03-31/functions/function/invocations | grep -q '"ok": true' || { docker logs of-failover; exit 1; }
      - if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE exists and the repository is immutable: push skipped"
          else
            docker tag of-failover:ci "$IMAGE"
            docker push "$IMAGE"
          fi

  codeql:
    #a private repository without Advanced Security refuses SARIF uploads, so the findings gate the job here instead
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          upload-database: false
          output: results
      - name: Fail on findings
        run: |
          findings=$(jq '[.runs[].results[]] | length' results/python.sarif)
          jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' results/python.sarif
          echo "codeql findings: $findings"
          [ "$findings" -eq 0 ]

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - name: Vulnerable dependencies, PyPI advisories
        run: pip-audit --strict -r requirements.txt

  snyk:
    #fork and Dependabot pull requests get no secrets; codeql and audit still cover them
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Code issues, high
        run: npx --yes snyk@1.1307.4 code test --severity-threshold=high

  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
